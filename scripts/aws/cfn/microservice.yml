AWSTemplateFormatVersion: 2010-09-09
Description: 'Example microservice deploy'

Transform:
  - UpdateDeploymentTransform

Parameters:
  # Deployment and ECS task configuration
  ProjectName:
    Type: String
    Description: 'Deployment prefix used to name resources'

  EnvironmentType:
    Type: String
    Description: 'Environment identifier passed to the service'

  Version:
    Type: String
    Description: 'Source revision identifier for tracking the deployed version.'

  TemplateBucketBaseUrl:
    Type: String
    Description: 'Base URL of the S3 bucket hosting the nested CloudFormation templates.'

  ECSClusterName:
    Type: String
    Description: 'Name of the ECS cluster that runs the microservice.'

  ContainerImageUri:
    Type: String
    Description: 'Full URI of the container image, including its repository and digest.'

  CpuArchitecture:
    Type: String
    Default: 'ARM'
    Description: 'CPU architecture of the Fargate tasks (ARM or AMD).'
    AllowedValues:
      - 'ARM'
      - 'AMD'

  # Instance parameters
  # 256 (.25 vCPU) - Available memory values: 0.5GB, 1GB, 2GB
  # 512 (.5 vCPU) - Available memory values: 1GB, 2GB, 3GB, 4GB
  # 1024 (1 vCPU) - Available memory values: 2GB, 3GB, 4GB, 5GB, 6GB, 7GB, 8GB
  # 2048 (2 vCPU) - Available memory values: Between 4GB and 16GB in 1GB increments
  # 4096 (4 vCPU) - Available memory values: Between 8GB and 30GB in 1GB increments
  CpuValue:
    Type: Number
    Default: 1024
    Description: 'CPU units reserved for each Fargate task (1024 units equal one vCPU).'

  # 0.5GB, 1GB, 2GB - Available cpu values: 256 (.25 vCPU)
  # 1GB, 2GB, 3GB, 4GB - Available cpu values: 512 (.5 vCPU)
  # 2GB, 3GB, 4GB, 5GB, 6GB, 7GB, 8GB - Available cpu values: 1024 (1 vCPU)
  # Between 4GB and 16GB in 1GB increments - Available cpu values: 2048 (2 vCPU)
  # Between 8GB and 30GB in 1GB increments - Available cpu values: 4096 (4 vCPU)
  MemoryAmount:
    Type: String
    Default: 2GB
    Description: 'Memory reserved for each Fargate task; must be compatible with the selected CPU allocation.'
    AllowedValues: [ 2GB, 4GB, 6GB, 8GB ]

  JavaToolOptions:
    Type: String
    Default: ''
    Description: 'JVM options passed to the application container through JAVA_TOOL_OPTIONS.'

  MountEfs:
    Type: String
    Default: false
    AllowedValues:
      - true
      - false
    Description: 'Whether to mount the configured EFS file system in the Fargate tasks.'

  FargateEFSFileSystemID:
    Type: String
    Description: 'ID of the EFS file system to mount when MountEfs is enabled.'

  # Networking, load balancing and API Gateway
  VpcId:
    Type: String
    Description: 'ID of the VPC hosting the microservice.'

  SubnetsIds:
    Type: String
    Description: 'Comma-separated subnet IDs supplied for deployment; this template places ECS tasks using VpcEgressSubnetsIds.'

  VpcEgressSubnetsIds:
    Type: String
    Description: 'Comma-separated IDs of the VPC egress subnets where the ECS tasks are deployed.'

  AlbSecurityGroup:
    Type: String
    Description: 'ID of the security group associated with the Application Load Balancer.'

  EcsDefaultSecurityGroup:
    Type: String
    Description: 'ID of the default security group used by the ECS service.'

  ApplicationLoadBalancerListenerArn:
    Type: String
    Description: 'ARN of the ALB listener on which the microservice routing rule is registered.'

  ApplicationLoadBalancerDomain:
    Type: String
    Description: 'ALB domain used by the private API Gateway integration to reach the service.'

  MicroserviceNumber:
    Type: Number
    Description: 'Priority assigned to the microservice routing rule on the ALB listener.'

  NetworkLoadBalancerLink:
    Type: String
    Description: 'VPC link used by API Gateway to reach the private load balancer.'

  SelcpgApiDnsName:
    Type: String
    Description: 'DNS name exposed for the SELC-PG REST API.'

  # ALB health checks
  HealthCheckPath:
    Type: String
    Default: '/actuator/health'
    Description: 'HTTP path probed by the ALB to check the health of each ECS target.'

  HealthCheckInterval:
    Description: 'Interval between ALB health checks, in seconds.'
    Type: Number
    Default: 60

  HealthCheckTimeout:
    Description: 'Time allowed for a health check response before the probe fails, in seconds.'
    Type: Number
    Default: 15

  HealthyThresholdCount:
    Description: 'Consecutive successful health checks required to mark a target healthy again.'
    Type: Number
    Default: 5

  UnhealthyThresholdCount:
    Description: 'Consecutive failed health checks required to mark a target unhealthy.'
    Type: Number
    Default: 2

  # ECS autoscaling
  MinTasksNumber:
    Default: 1
    Type: Number
    Description: 'Minimum number of ECS tasks maintained by autoscaling.'

  MaxTasksNumber:
    Default: 6
    Type: Number
    Description: 'Maximum number of ECS tasks allowed by autoscaling.'

  AutoscalingCheckPeriod:
    Default: 60
    Type: Number
    Description: 'Period of each autoscaling metric datapoint, in seconds.'

  AutoscalingThreshold:
    Default: 70
    Type: String
    Description: 'Threshold for the metric used by the REST API autoscaling policy.'

  AutoscalingDataPointM:
    Default: 1
    Type: Number
    Description: 'Number of metric datapoints evaluated by the autoscaling alarm.'

  AutoscalingDataPointN:
    Default: 1
    Type: Number
    Description: 'Number of breaching datapoints required to trigger the autoscaling alarm.'

  # Logging, metrics and alarms
  EcsLogGroup:
    Type: String
    Description: 'Name of the CloudWatch Logs group that receives ECS container logs.'

  LogsKinesisSourceStreamArn:
    Type: String
    Description: 'ARN of the Kinesis stream that receives CloudWatch logs from API Gateway.'

  LogAlarmStrategy:
    Type: String
    Default: 'FATAL'
    Description: 'Log alarm strategy passed to the ECS deployment template.'

  AlarmSNSTopicArn:
    Type: String
    Description: 'ARN of the SNS topic that receives CloudWatch alarm notifications.'

  WireTapLogActivation:
    Type: String
    Default: false
    Description: 'Whether to enable wire-level logging for HTTP clients.'
    AllowedValues:
      - true
      - false

  CronAnalyzer:
    Type: String
    Default: '-'
    Description: 'Cron expression that schedules publication of analyzer metrics to CloudWatch.'

  MetricFormatType:
    Type: String
    Description: 'Format used to emit application metrics, such as Embedded Metric Format (EMF).'
    Default: 'EMF'

  # Shared application settings and PDND
  EnableCxIdValidation:
    Type: String
    AllowedValues:
      - true
      - false
    Description: 'Whether to validate the caller ID (cx-id) on incoming requests.'

  CustomRetryMaxAttempts:
    Default: 3
    Type: Number
    Description: 'Maximum retry attempts for clients that use the custom retry policy.'

  CodecMemorySize:
    Type: String
    Description: 'Maximum data buffered in memory by Spring HTTP codecs, for example 4MB or 4000000 bytes.'

  PdndBaseUrl:
    Type: String
    Description: 'Base URL of the PDND service used to obtain access tokens for registry APIs.'

  SecretAndSSMPrefix:
    Type: String
    Default: pn-national-registries
    Description: 'Name prefix used to scope access to Secrets Manager secrets and SSM parameters.'

  # INAD - API access, batch submission and polling
  InadBaseUrl:
    Type: String
    Description: 'Base URL of the INAD API for digital domicile lookups.'

  InadPdndSecret:
    Type: String
    Description: 'ARN of the Secrets Manager secret containing the PDND client assertion claims for INAD.'

  EnableInadMassiveApi:
    Type: String
    Description: 'Whether to use the INAD bulk API; when disabled, INAD lookups use only synchronous APIs.'
    AllowedValues:
      - true
      - false

  EnablePfPecFallbackFlow:
    Type: String
    Description: 'Whether to query INIPEC when INAD returns no PEC address for a natural person.'
    AllowedValues:
      - true
      - false

  InadMaxBatchSize:
    Type: Number
    Description: 'Maximum number of requests that can be included in an INAD batch submission.'
    Default: 1000

  InadRequestOldestMaxWaitingSeconds:
    Type: Number
    Description: 'Age in seconds at which the oldest queued request can trigger submission of a partially filled INAD batch.'
    Default: 300

  InadRequestBatchJobDelay:
    Type: Number
    Description: 'Delay between executions of the INAD batch submission job, in milliseconds.'
    Default: 5000

  InadRequestBatchJobLockAtMost:
    Type: Number
    Description: 'Maximum duration of the distributed lock for INAD batch submission, in milliseconds.'
    Default: 27000

  InadRequestBatchJobLockAtLeast:
    Type: Number
    Description: 'Minimum duration of the distributed lock for INAD batch submission, in milliseconds.'
    Default: 22000

  InadRequestMaxRetry:
    Type: Number
    Description: 'Maximum retries for a failed INAD batch submission.'
    Default: 3

  InadRequestRetryAfter:
    Type: Number
    Description: 'Delay before retrying a failed INAD batch submission, in seconds.'
    Default: 3600

  InadPollingDelay:
    Type: Number
    Description: 'Configured interval for INAD batch result polling, in milliseconds.'
    Default: 30000

  InadPollingLockAtMost:
    Type: Number
    Description: 'Maximum duration of the distributed lock for INAD batch polling, in milliseconds.'
    Default: 30000

  InadPollingLockAtLeast:
    Type: Number
    Description: 'Minimum duration of the distributed lock for INAD batch polling, in milliseconds.'
    Default: 1000

  InadPollingFirstAttemptFixedDelaySeconds:
    Type: Number
    Description: 'Fixed delay before the first INAD polling attempt, in seconds, before adding the per-tax-code delay.'
    Default: 300

  InadPollingFirstAttemptDelaySecondsPerCf:
    Type: Number
    Description: 'Additional first-poll delay in seconds per tax code in the INAD batch.'
    Default: 0.085

  InadPollingErrorMaxRetry:
    Type: Number
    Description: 'Maximum INAD polling retries after a polling error.'
    Default: 3

  InadPollingErrorRetryAfter:
    Type: Number
    Description: 'Delay before retrying INAD polling after an error, in seconds.'
    Default: 3600

  InadPollingInProgressMaxRetry:
    Type: Number
    Description: 'Maximum INAD polling retries while the batch is still being processed.'
    Default: 24

  InadPollingInProgressRetryAfter:
    Type: Number
    Description: 'Delay before polling an INAD batch that is still being processed, in seconds.'
    Default: 3600

  # INIPEC / InfoCamere - API access, batch submission, polling and recovery
  InfoCamereBaseUrl:
    Type: String
    Description: 'Base URL of the InfoCamere API used for INIPEC lookups.'

  InfoCamereClientId:
    Type: String
    Description: 'Client identifier used to authenticate requests to the InfoCamere API.'

  InfoCamereCertPath:
    Type: String
    Description: 'Name of the SSM parameter that stores the InfoCamere client authentication certificate.'

  InfoCamereFqdn:
    Type: String
    Description: 'Client FQDN used when generating the InfoCamere certificate.'

  InfoCamereSigningKeyAlias:
    Type: String
    Default: pn-national-registries-infocamere-signing-key-alias
    Description: 'Base KMS signing key alias; the renewal job appends -next for the replacement key.'

  IniPecConnectionTimeoutMillis:
    Type: Number
    Description: 'Connection timeout for the InfoCamere PEC API client, in milliseconds.'
    Default: 3000 # pn-commons default value

  InfoCamereReadTimeoutMillis:
    Type: Number
    Description: 'Read timeout for the InfoCamere PEC API client, in milliseconds.'
    Default: 8000 # pn-commons default value


  IniPecMaxRetryAttempts:
    Type: Number
    Description: 'Maximum retries for HTTP calls to the InfoCamere PEC API.'
    Default: 3 # pn-commons default value


  IniPecRetryOnTimeout:
    Type: String
    Description: 'Whether the InfoCamere PEC API client retries timed-out calls.'
    Default: false

  EnableOldInipecFlow:
    Type: String
    Description: 'Whether to use the legacy INIPEC workflow instead of the new workflow.'
    AllowedValues:
      - true
      - false

  InipecMaxBatchSize:
    Type: Number
    Description: 'Maximum number of requests that can be included in an INIPEC batch submission.'
    Default: 100

  InipecRequestBatchJobDelay:
    Type: Number
    Description: 'Delay between executions of the INIPEC batch submission job, in milliseconds.'
    Default: 5000

  InipecRequestBatchJobLockAtMost:
    Type: Number
    Description: 'Maximum duration of the distributed lock for INIPEC batch submission, in milliseconds.'
    Default: 27000

  InipecRequestBatchJobLockAtLeast:
    Type: Number
    Description: 'Minimum duration of the distributed lock for INIPEC batch submission, in milliseconds.'
    Default: 22000

  InipecRequestMaxRetry:
    Type: Number
    Description: 'Maximum retries for a failed INIPEC batch submission.'
    Default: 3

  InipecRequestRetryAfter:
    Type: Number
    Description: 'Delay before retrying a failed INIPEC batch submission, in seconds.'
    Default: 3600

  InipecRequestRecoveryAfter:
    Type: Number
    Description: 'Age at which unfinished INIPEC batch requests become eligible for recovery, in seconds.'
    Default: 3600

  InipecRequestRecoveryDelay:
    Type: Number
    Description: 'Delay between runs of the INIPEC batch request recovery job, in milliseconds.'
    Default: 30000

  InipecRequestRecoveryLockAtMost:
    Type: Number
    Description: 'Maximum duration of the distributed lock for INIPEC request recovery, in milliseconds.'
    Default: 30000

  InipecRequestRecoveryLockAtLeast:
    Type: Number
    Description: 'Minimum duration of the distributed lock for INIPEC request recovery, in milliseconds.'
    Default: 1000

  InipecPollingDelay:
    Type: Number
    Description: 'Delay between executions of the INIPEC batch result polling job, in milliseconds.'
    Default: 30000

  InipecPollingLockAtMost:
    Type: Number
    Description: 'Maximum duration of the distributed lock for INIPEC batch polling, in milliseconds.'
    Default: 30000

  InipecPollingLockAtLeast:
    Type: Number
    Description: 'Minimum duration of the distributed lock for INIPEC batch polling, in milliseconds.'
    Default: 1000

  InipecPollingFirstAttemptFixedDelaySeconds:
    Type: Number
    Description: 'Fixed delay before the first INIPEC polling attempt, in seconds, before adding the per-tax-code delay.'
    Default: 300

  InipecPollingFirstAttemptDelaySecondsPerCf:
    Type: Number
    Description: 'Additional first-poll delay in seconds per tax code in the INIPEC batch.'
    Default: 0.085

  InipecPollingErrorMaxRetry:
    Type: Number
    Description: 'Maximum INIPEC polling retries after a polling error.'
    Default: 3

  InipecPollingErrorRetryAfter:
    Type: Number
    Description: 'Delay before retrying INIPEC polling after an error, in seconds.'
    Default: 3600

  InipecPollingInProgressMaxRetry:
    Type: Number
    Description: 'Maximum INIPEC polling retries while the batch is still being processed.'
    Default: 24

  InipecPollingInProgressRetryAfter:
    Type: Number
    Description: 'Delay before polling an INIPEC batch that is still being processed, in seconds.'
    Default: 3600

  InipecPollingRecoveryAfter:
    Type: Number
    Description: 'Age at which stalled INIPEC polling records become eligible for recovery, in seconds.'
    Default: 3600

  InipecPollingRecoveryDelay:
    Type: Number
    Description: 'Delay between runs of the INIPEC polling recovery job, in milliseconds.'
    Default: 30000

  InipecPollingRecoveryLockAtMost:
    Type: Number
    Description: 'Maximum duration of the distributed lock for INIPEC polling recovery, in milliseconds.'
    Default: 30000

  InipecPollingRecoveryLockAtLeast:
    Type: Number
    Description: 'Minimum duration of the distributed lock for INIPEC polling recovery, in milliseconds.'
    Default: 1000

  InipecSqsRecoveryDelay:
    Type: Number
    Description: 'Delay between runs of the job that recovers INIPEC results not yet sent to SQS, in milliseconds.'
    Default: 30000

  InipecSqsRecoveryLockAtMost:
    Type: Number
    Description: 'Maximum duration of the distributed lock for INIPEC SQS delivery recovery, in milliseconds.'
    Default: 30000

  InipecSqsRecoveryLockAtLeast:
    Type: Number
    Description: 'Minimum duration of the distributed lock for INIPEC SQS delivery recovery, in milliseconds.'
    Default: 1000

  # ANPR - API access and address composition
  AnprBaseUrl:
    Type: String
    Description: 'Base URL of the ANPR API for residence address lookups.'

  AnprPdndSecret:
    Type: String
    Description: 'ARN of the Secrets Manager secret containing the PDND client assertion claims for ANPR.'

  AnprTrustSecret:
    Type: String
    Description: 'Name of the Secrets Manager secret containing the trusted TLS certificate for ANPR.'

  AnprAddressCompositionMode:
    Type: String
    Description: 'Controls how ANPR populates the address and addressDetail fields (OLD, FULL, OLD_MINIMAL or MINIMAL).'
    Default: "OLD"

  # Agenzia delle Entrate - legal representative and tax code verification
  AdeLegalBaseUrl:
    Type: String
    Description: 'Base URL of the Agenzia delle Entrate legal representative lookup API.'

  AdeLegalNameId:
    Type: String
    Description: 'NameID used when authenticating to the legal representative API.'

  AdeLegalTrustSecret:
    Type: String
    Description: 'Name of the Secrets Manager secret containing the trusted TLS certificate for the legal representative API.'

  AdeCheckCfBaseUrl:
    Type: String
    Description: 'Base URL of the Agenzia delle Entrate tax code verification API.'

  AdeCheckCfPdndSecret:
    Type: String
    Description: 'ARN of the Secrets Manager secret containing the PDND client assertion claims for tax code verification.'

  AdeCheckCfTrustSecret:
    Type: String
    Description: 'Name of the Secrets Manager secret containing the trusted TLS certificate for the tax code verification API.'

  AdeSslCertPath:
    Type: String
    Description: 'Name of the SSM parameter for the Agenzia delle Entrate client authentication certificate.'

  AdeSslSecret:
    Type: String
    Description: 'Base Secrets Manager secret name; the renewal job appends -next to store the replacement private key.'

  AdeFqdn:
    Type: String
    Description: 'Client FQDN used when generating the Agenzia delle Entrate certificate.'

  # IPA - API access
  IpaBaseUrl:
    Type: String
    Description: 'Base URL of the IPA API for public administration directory lookups.'

  IpaSecret:
    Type: String
    Description: 'Name of the Secrets Manager secret containing the credentials used to access the IPA API.'

  # Shared certificate renewal
  CertificateRenewalEmail:
    Type: String
    Default: 'alarm@notifichedigitali.it' # aggiornare
    Description: 'Email address passed to the certificate generation jobs for InfoCamere and Agenzia delle Entrate.'

  CertificateDLQARN:
    Type: String
    Description: 'ARN of the SQS dead-letter queue for failed certificate renewal event deliveries.'

  CertificateDLQURL:
    Type: String
    Description: 'URL of the certificate renewal dead-letter queue, used by its queue policy.'

  # DynamoDB tables, streams and encryption
  BatchRequestTtl:
    Type: Number
    Description: 'TTL in seconds for persisted batch request data.'
    Default: 1209600

  QueryLimit:
    Type: Number
    Description: 'Maximum number of items evaluated by a DynamoDB query on the National Registries tables.'
    Default: 1000

  CounterTableArn:
    Type: String
    Description: 'ARN of the DynamoDB table that stores e-service counters.'

  CounterTableName:
    Type: String
    Description: 'Name of the DynamoDB table that stores e-service counters.'

  BatchRequestTableArn:
    Type: String
    Description: 'ARN of the DynamoDB table that stores legacy batch request records.'

  BatchPollingTableArn:
    Type: String
    Description: 'ARN of the DynamoDB table that tracks legacy batch polling.'

  BatchRequestEncryptKeyARN:
    Type: String
    Description: 'ARN of the KMS key used to encrypt and decrypt batch request data.'

  ShedLockTableName:
    Type: String
    Description: 'Name of the DynamoDB table used by ShedLock to coordinate scheduled jobs across ECS tasks.'

  ShedLockTableArn:
    Type: String
    Description: 'ARN of the DynamoDB table used by ShedLock, for IAM permissions.'

  RequestsTableName:
    Type: String
    Description: 'Name of the DynamoDB table that stores individual registry requests and their statuses.'

  RequestsTableArn:
    Type: String
    Description: 'ARN of the registry requests table, for IAM permissions.'

  RequestsTableStreamArn:
    Type: String
    Description: 'ARN of the registry requests DynamoDB stream, which includes old and new item images.'

  BatchesTableName:
    Type: String
    Description: 'Name of the DynamoDB table that stores registry batches and their processing statuses.'

  BatchesTableArn:
    Type: String
    Description: 'ARN of the registry batches table, for IAM permissions.'

  BatchesTableStreamArn:
    Type: String
    Description: 'ARN of the registry batches DynamoDB stream, which includes old and new item images.'

  # SQS queues and EventBridge Pipe
  GatewayInputsQueueName:
    Type: String
    Description: 'Name of the SQS queue polled by the service for incoming registry requests.'

  GatewayInputsQueueARN:
    Type: String
    Description: 'ARN of the incoming registry requests queue'

  GatewayInputsDLQName:
    Type: String
    Description: 'Name of the SQS dead-letter queue for registry requests that could not be processed.'

  GatewayInputsDLQARN:
    Type: String
    Description: 'ARN of the incoming requests dead-letter queue, also targeted by EventBridge.'

  GatewayOutputsQueueName:
    Type: String
    Description: 'Name of the SQS queue where the service publishes gateway output messages.'

  GatewayOutputsQueueARN:
    Type: String
    Description: 'ARN of the gateway output queue'

  PollingQueueName:
    Type: String
    Description: 'Name of the SQS queue consumed by the service for batch polling messages.'

  PollingQueueARN:
    Type: String
    Description: 'ARN of the batch polling queue used as an EventBridge Scheduler target.'

  GatewayResponsesQueueName:
    Type: String
    Description: 'Name of the SQS queue where the service publishes responses for the EventBridge Pipe.'

  GatewayResponsesQueueARN:
    Type: String
    Description: 'ARN of the SQS response queue that feeds the EventBridge Pipe.'

  PipeBatchSize:
    Type: Number
    Default: 2
    Description: 'Maximum number of SQS messages read per batch by the pipe that forwards responses to the core event bus.'

  PipeWindowSize:
    Type: Number
    Default: 30
    Description: 'Maximum time the response pipe waits to collect a batch of SQS messages, in seconds.'

Resources:

  # PN-National-Registry microservice
  NationalRegistryMicroservice:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${TemplateBucketBaseUrl}/fragments/ecs-service.yaml"
      Parameters:
        CpuValue: !Ref CpuValue
        MemoryAmount: !Ref MemoryAmount
        HealthCheckTimeout: !Ref HealthCheckTimeout
        HealthCheckInterval: !Ref HealthCheckInterval
        HealthyThresholdCount: !Ref HealthyThresholdCount
        UnhealthyThresholdCount: !Ref UnhealthyThresholdCount
        AutoscalingThreshold: !Ref AutoscalingThreshold
        AutoscalingCheckPeriod: !Ref AutoscalingCheckPeriod
        MinTasksNumber: !Ref MinTasksNumber
        MaxTasksNumber: !Ref MaxTasksNumber
        AutoscalingDataPointN: !Ref AutoscalingDataPointN
        AutoscalingDataPointM: !Ref AutoscalingDataPointM
        HealthCheckPath: !Ref HealthCheckPath
        AutoscalingStrategy: REST-API
        MicroServiceUniqueName: !Sub '${ProjectName}-national-registries'
        AlarmSNSTopicArn: !Ref AlarmSNSTopicArn
        EfsFilesystem: !Ref FargateEFSFileSystemID
        MountEfs: !Ref MountEfs
        WireTapLogActivation: !Ref WireTapLogActivation
        ContainerImageURI: !Sub '${ContainerImageUri}'

        # Infrastructure - runtime and health checks
        ContainerEnvEntry1: !Sub 'AWS_REGIONCODE=${AWS::Region}'
        ContainerEnvEntry2: !Sub 'PN_NATIONALREGISTRIES_ENVIRONMENTTYPE=${EnvironmentType}'
        ContainerEnvEntry3: !Sub 'PN_NATIONALREGISTRIES_HEALTHCHECKPATH=${HealthCheckPath}'

        # Infrastructure - logging, metrics and HTTP codecs
        ContainerEnvEntry4: !Sub 'WIRE_TAP_LOG=${WireTapLogActivation}'
        ContainerEnvEntry5: !Sub 'METRIC_FORMAT_TYPE=${MetricFormatType}'
        ContainerEnvEntry6: !Sub 'PN_CRON_ANALYZER=${CronAnalyzer}'
        ContainerEnvEntry7: !Sub 'SPRING_CODEC_MAXINMEMORYSIZE=${CodecMemorySize}'

        # Infrastructure - DynamoDB tables
        ContainerEnvEntry8: !Sub 'PN_NATIONALREGISTRIES_DAO_SHEDLOCKTABLENAME=${ShedLockTableName}'
        ContainerEnvEntry9: !Sub 'PN_NATIONALREGISTRIES_DAO_REQUESTSTABLENAME=${RequestsTableName}'
        ContainerEnvEntry10: !Sub 'PN_NATIONALREGISTRIES_DAO_BATCHESTABLENAME=${BatchesTableName}'
        ContainerEnvEntry11: !Sub 'PN_NATIONALREGISTRIES_DAO_COUNTERTABLENAME=${CounterTableName}'

        # Infrastructure - SQS queues
        ContainerEnvEntry12: !Sub 'PN_NATIONALREGISTRIES_TOPIC_INPUTQUEUENAME=${GatewayInputsQueueName}'
        ContainerEnvEntry13: !Sub 'PN_NATIONALREGISTRIES_TOPIC_INPUTDLQQUEUENAME=${GatewayInputsDLQName}'
        ContainerEnvEntry14: !Sub 'PN_NATIONALREGISTRIES_TOPIC_OUTPUTQUEUENAME=${GatewayOutputsQueueName}'
        ContainerEnvEntry15: !Sub 'PN_NATIONALREGISTRIES_TOPIC_POLLINGQUEUENAME=${PollingQueueName}'
        ContainerEnvEntry16: !Sub 'PN_NATIONALREGISTRIES_TOPIC_GATEWAYRESPONSEQUEUENAME=${GatewayResponsesQueueName}'

        # Feature flags
        ContainerEnvEntry17: !Sub 'PN_NATIONALREGISTRIES_ENABLEPFPECFALLBACKFLOW=${EnablePfPecFallbackFlow}'
        ContainerEnvEntry18: !Sub 'PN_NATIONALREGISTRIES_ENABLEINADMASSIVEAPI=${EnableInadMassiveApi}'
        ContainerEnvEntry19: !Sub 'PN_NATIONALREGISTRIES_ENABLEOLDINIPECFLOW=${EnableOldInipecFlow}'
        ContainerEnvEntry20: !Sub 'PN_NATIONALREGISTRIES_ENABLECXIDVALIDATION=${EnableCxIdValidation}'

        # PDND
        ContainerEnvEntry21: !Sub 'PN_NATIONALREGISTRIES_PDND_BASEURL=${PdndBaseUrl}'

        # ANPR
        ContainerEnvEntry22: !Sub 'PN_NATIONALREGISTRIES_ANPR_BASEURL=${AnprBaseUrl}'
        ContainerEnvEntry23: !Sub 'PN_NATIONALREGISTRIES_ANPR_TRUSTSECRET=${AnprTrustSecret}'
        ContainerEnvEntry24: !Sub 'PN_NATIONALREGISTRIES_ANPR_PDNDCLIENTSECRET=${AnprPdndSecret}'
        ContainerEnvEntry25: !Sub 'PN_NATIONALREGISTRIES_ANPR_ADDRESSCOMPOSITIONMODE=${AnprAddressCompositionMode}'

        # Agenzia delle Entrate
        ContainerEnvEntry26: !Sub 'PN_NATIONALREGISTRIES_ADE_AUTH=${AdeSslCertPath}'
        ContainerEnvEntry27: !Sub 'PN_NATIONALREGISTRIES_ADE_LEGALBASEURL=${AdeLegalBaseUrl}'
        ContainerEnvEntry28: !Sub 'PN_NATIONALREGISTRIES_ADE_LEGALTRUSTSECRET=${AdeLegalTrustSecret}'
        ContainerEnvEntry29: !Sub 'PN_NATIONALREGISTRIES_ADE_LEGALNAMEID=${AdeLegalNameId}'
        ContainerEnvEntry30: !Sub 'PN_NATIONALREGISTRIES_ADE_CHECKCFBASEURL=${AdeCheckCfBaseUrl}'
        ContainerEnvEntry31: !Sub 'PN_NATIONALREGISTRIES_ADE_CHECKCFTRUSTSECRET=${AdeCheckCfTrustSecret}'
        ContainerEnvEntry32: !Sub 'PN_NATIONALREGISTRIES_ADE_CHECKCFPDNDCLIENTSECRET=${AdeCheckCfPdndSecret}'

        # INAD - API access
        ContainerEnvEntry33: !Sub 'PN_NATIONALREGISTRIES_INAD_BASEURL=${InadBaseUrl}'
        ContainerEnvEntry34: !Sub 'PN_NATIONALREGISTRIES_INAD_PDNDCLIENTSECRET=${InadPdndSecret}'

        # IPA
        ContainerEnvEntry35: !Sub 'PN_NATIONALREGISTRIES_IPA_BASEURL=${IpaBaseUrl}'
        ContainerEnvEntry36: !Sub 'PN_NATIONALREGISTRIES_IPA_SECRET=${IpaSecret}'

        # INIPEC / InfoCamere - API access
        ContainerEnvEntry37: !Sub 'PN_NATIONALREGISTRIES_INFOCAMERE_BASEURL=${InfoCamereBaseUrl}'
        ContainerEnvEntry38: !Sub 'PN_NATIONALREGISTRIES_INFOCAMERE_CLIENTID=${InfoCamereClientId}'
        ContainerEnvEntry39: !Sub 'PN_NATIONALREGISTRIES_INFOCAMERE_CERTPATH=${InfoCamereCertPath}'
        ContainerEnvEntry40: !Sub 'PN_NATIONALREGISTRIES_INFOCAMERE_READTIMEOUTMILLIS=${InfoCamereReadTimeoutMillis}'
        ContainerEnvEntry41: !Sub 'PN_NATIONALREGISTRIES_INFOCAMERE_CONNECTIONTIMEOUTMILLIS=${IniPecConnectionTimeoutMillis}'
        ContainerEnvEntry42: !Sub 'PN_NATIONALREGISTRIES_INFOCAMERE_MAXRETRYATTEMPTS=${IniPecMaxRetryAttempts}'
        ContainerEnvEntry43: !Sub 'PN_NATIONALREGISTRIES_INFOCAMERE_RETRYONTIMEOUT=${IniPecRetryOnTimeout}'

        # Shared retry and batch settings
        ContainerEnvEntry44: !Sub 'PN_NATIONALREGISTRIES_CUSTOMRETRYMAXATTEMPTS=${CustomRetryMaxAttempts}'
        ContainerEnvEntry45: !Sub 'PN_NATIONALREGISTRIES_BATCHREQUESTTTL=${BatchRequestTtl}'
        ContainerEnvEntry46: !Sub 'PN_NATIONALREGISTRIES_QUERYLIMIT=${QueryLimit}'

        # INIPEC - batch submission, polling and recovery
        ContainerEnvEntry47: !Sub 'PN_NATIONALREGISTRIES_INIPEC_MAXBATCHSIZE=${InipecMaxBatchSize}'
        ContainerEnvEntry48: !Sub 'PN_NATIONALREGISTRIES_INIPEC_REQUESTMAXRETRY=${InipecRequestMaxRetry}'
        ContainerEnvEntry49: !Sub 'PN_NATIONALREGISTRIES_INIPEC_REQUESTRETRYAFTER=${InipecRequestRetryAfter}'
        ContainerEnvEntry50: !Sub 'PN_NATIONALREGISTRIES_INIPEC_REQUESTBATCHJOBDELAY=${InipecRequestBatchJobDelay}'
        ContainerEnvEntry51: !Sub 'PN_NATIONALREGISTRIES_INIPEC_REQUESTBATCHJOBLOCKATMOST=${InipecRequestBatchJobLockAtMost}'
        ContainerEnvEntry52: !Sub 'PN_NATIONALREGISTRIES_INIPEC_REQUESTBATCHJOBLOCKATLEAST=${InipecRequestBatchJobLockAtLeast}'
        ContainerEnvEntry53: !Sub 'PN_NATIONALREGISTRIES_INIPEC_REQUESTRECOVERYDELAY=${InipecRequestRecoveryDelay}'
        ContainerEnvEntry54: !Sub 'PN_NATIONALREGISTRIES_INIPEC_REQUESTRECOVERYLOCKATMOST=${InipecRequestRecoveryLockAtMost}'
        ContainerEnvEntry55: !Sub 'PN_NATIONALREGISTRIES_INIPEC_REQUESTRECOVERYLOCKATLEAST=${InipecRequestRecoveryLockAtLeast}'
        ContainerEnvEntry56: !Sub 'PN_NATIONALREGISTRIES_INIPEC_REQUESTRECOVERYAFTER=${InipecRequestRecoveryAfter}'
        ContainerEnvEntry57: !Sub 'PN_NATIONALREGISTRIES_INIPEC_SQSRECOVERYDELAY=${InipecSqsRecoveryDelay}'
        ContainerEnvEntry58: !Sub 'PN_NATIONALREGISTRIES_INIPEC_SQSRECOVERYLOCKATMOST=${InipecSqsRecoveryLockAtMost}'
        ContainerEnvEntry59: !Sub 'PN_NATIONALREGISTRIES_INIPEC_SQSRECOVERYLOCKATLEAST=${InipecSqsRecoveryLockAtLeast}'
        ContainerEnvEntry60: !Sub 'PN_NATIONALREGISTRIES_INIPEC_POLLINGERRORMAXRETRY=${InipecPollingErrorMaxRetry}'
        ContainerEnvEntry61: !Sub 'PN_NATIONALREGISTRIES_INIPEC_POLLINGINPROGRESSMAXRETRY=${InipecPollingInProgressMaxRetry}'
        ContainerEnvEntry62: !Sub 'PN_NATIONALREGISTRIES_INIPEC_POLLINGERRORRETRYAFTER=${InipecPollingErrorRetryAfter}'
        ContainerEnvEntry63: !Sub 'PN_NATIONALREGISTRIES_INIPEC_POLLINGINPROGRESSRETRYAFTER=${InipecPollingInProgressRetryAfter}'
        ContainerEnvEntry64: !Sub 'PN_NATIONALREGISTRIES_INIPEC_POLLINGFIRSTATTEMPTDELAYSECONDSPERCF=${InipecPollingFirstAttemptDelaySecondsPerCf}'
        ContainerEnvEntry65: !Sub 'PN_NATIONALREGISTRIES_INIPEC_POLLINGFIRSTATTEMPTFIXEDDELAYSECONDS=${InipecPollingFirstAttemptFixedDelaySeconds}'
        ContainerEnvEntry66: !Sub 'PN_NATIONALREGISTRIES_INIPEC_POLLINGDELAY=${InipecPollingDelay}'
        ContainerEnvEntry67: !Sub 'PN_NATIONALREGISTRIES_INIPEC_POLLINGLOCKATMOST=${InipecPollingLockAtMost}'
        ContainerEnvEntry68: !Sub 'PN_NATIONALREGISTRIES_INIPEC_POLLINGLOCKATLEAST=${InipecPollingLockAtLeast}'
        ContainerEnvEntry69: !Sub 'PN_NATIONALREGISTRIES_INIPEC_POLLINGRECOVERYDELAY=${InipecPollingRecoveryDelay}'
        ContainerEnvEntry70: !Sub 'PN_NATIONALREGISTRIES_INIPEC_POLLINGRECOVERYLOCKATMOST=${InipecPollingRecoveryLockAtMost}'
        ContainerEnvEntry71: !Sub 'PN_NATIONALREGISTRIES_INIPEC_POLLINGRECOVERYLOCKATLEAST=${InipecPollingRecoveryLockAtLeast}'
        ContainerEnvEntry72: !Sub 'PN_NATIONALREGISTRIES_INIPEC_POLLINGRECOVERYAFTER=${InipecPollingRecoveryAfter}'

        # INAD - batch submission and polling
        ContainerEnvEntry73: !Sub 'PN_NATIONALREGISTRIES_INAD_MAXBATCHSIZE=${InadMaxBatchSize}'
        ContainerEnvEntry74: !Sub 'PN_NATIONALREGISTRIES_INAD_REQUESTMAXRETRY=${InadRequestMaxRetry}'
        ContainerEnvEntry75: !Sub 'PN_NATIONALREGISTRIES_INAD_REQUESTRETRYAFTER=${InadRequestRetryAfter}'
        ContainerEnvEntry76: !Sub 'PN_NATIONALREGISTRIES_INAD_REQUESTBATCHJOBDELAY=${InadRequestBatchJobDelay}'
        ContainerEnvEntry77: !Sub 'PN_NATIONALREGISTRIES_INAD_REQUESTBATCHJOBLOCKATMOST=${InadRequestBatchJobLockAtMost}'
        ContainerEnvEntry78: !Sub 'PN_NATIONALREGISTRIES_INAD_REQUESTBATCHJOBLOCKATLEAST=${InadRequestBatchJobLockAtLeast}'
        ContainerEnvEntry79: !Sub 'PN_NATIONALREGISTRIES_INAD_REQUESTOLDESTMAXWAITINGSECONDS=${InadRequestOldestMaxWaitingSeconds}'
        ContainerEnvEntry80: !Sub 'PN_NATIONALREGISTRIES_INAD_POLLINGERRORMAXRETRY=${InadPollingErrorMaxRetry}'
        ContainerEnvEntry81: !Sub 'PN_NATIONALREGISTRIES_INAD_POLLINGINPROGRESSMAXRETRY=${InadPollingInProgressMaxRetry}'
        ContainerEnvEntry82: !Sub 'PN_NATIONALREGISTRIES_INAD_POLLINGERRORRETRYAFTER=${InadPollingErrorRetryAfter}'
        ContainerEnvEntry83: !Sub 'PN_NATIONALREGISTRIES_INAD_POLLINGINPROGRESSRETRYAFTER=${InadPollingInProgressRetryAfter}'
        ContainerEnvEntry84: !Sub 'PN_NATIONALREGISTRIES_INAD_POLLINGFIRSTATTEMPTDELAYSECONDSPERCF=${InadPollingFirstAttemptDelaySecondsPerCf}'
        ContainerEnvEntry85: !Sub 'PN_NATIONALREGISTRIES_INAD_POLLINGFIRSTATTEMPTFIXEDDELAYSECONDS=${InadPollingFirstAttemptFixedDelaySeconds}'
        ContainerEnvEntry86: !Sub 'PN_NATIONALREGISTRIES_INAD_POLLINGDELAY=${InadPollingDelay}'
        ContainerEnvEntry87: !Sub 'PN_NATIONALREGISTRIES_INAD_POLLINGLOCKATMOST=${InadPollingLockAtMost}'
        ContainerEnvEntry88: !Sub 'PN_NATIONALREGISTRIES_INAD_POLLINGLOCKATLEAST=${InadPollingLockAtLeast}'

        # MicroServiceSecretAndSSMPrefix: !Sub '${SecretAndSSMPrefix}'
        MappedPaths: '/national-registries-private/*'
        ECSClusterName: !Ref ECSClusterName
        Subnets: !Ref VpcEgressSubnetsIds
        VpcId: !Ref VpcId
        AlbSecurityGroup: !Ref AlbSecurityGroup
        EcsDefaultSecurityGroup: !Ref EcsDefaultSecurityGroup
        LoadBalancerListenerArn: !Ref ApplicationLoadBalancerListenerArn
        LoadBalancerRulePriority: !Ref MicroserviceNumber
        TaskRoleManagedPolicyArn: !Ref MicroserviceTaskManagedPolicy
        EcsLogGroup: !Ref EcsLogGroup
        LogAlarmStrategyV1: !Ref LogAlarmStrategy
        JavaToolOptions: !Ref JavaToolOptions
        CpuArchitecture: !Ref CpuArchitecture

  MicroserviceTaskManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
            Resource:
              - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretAndSSMPrefix}*'
          - Effect: Allow
            Action:
              - kms:Sign
            Resource:
              - !Sub 'arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:key/*'
          - Effect: Allow
            Action:
              - kms:Encrypt
              - kms:Decrypt
            Resource:
              - !Ref BatchRequestEncryptKeyARN
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:UpdateItem
              - dynamodb:PutItem
            Resource:
              - !Ref CounterTableArn
              - !Ref BatchRequestTableArn
              - !Ref BatchPollingTableArn
              - !Ref ShedLockTableArn
              - !Ref RequestsTableArn
              - !Ref BatchesTableArn
              - !Sub '${BatchRequestTableArn}/index/*'
              - !Sub '${BatchPollingTableArn}/index/*'
              - !Sub '${RequestsTableArn}/index/*'
              - !Sub '${BatchesTableArn}/index/*'

          - Effect: Allow
            Action:
              - sqs:SendMessage
              - sqs:GetQueueUrl
              - sqs:ChangeMessageVisibility
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
              - sqs:ReceiveMessage
            Resource:
              - !Ref GatewayOutputsQueueARN
              - !Ref GatewayInputsQueueARN
              - !Ref GatewayInputsDLQARN
              - !Ref PollingQueueARN
              - !Ref GatewayResponsesQueueARN
          - Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
            Resource:
              - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/MapTaxIdWhiteList'
              - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${SecretAndSSMPrefix}/*'

  RequestErrorPipeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-national-registries-request-error-pipe-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - pipes.amazonaws.com
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:pipes:${AWS::Region}:${AWS::AccountId}:pipe/pn-national-registries-request-error-pipe'
      Policies:
        - PolicyName: pn-national-registries-request-error-pipe-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadRequestDynamoDbStream
                Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource:
                  - !Ref RequestsTableStreamArn
              - Sid: SendToNationalRegistryGatewayInputsDlq
                Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  - !Ref GatewayInputsDLQARN
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !Ref BatchRequestEncryptKeyARN

  NationalRegistriesToEventBusPipe:
    Type: AWS::Pipes::Pipe
    Properties:
      Name: !Sub ${ProjectName}-national-registries-to-event-bus-pipe
      Description: 'Pipe from National Registries Queue to core event bus'
      RoleArn: !GetAtt NationalRegistriesToEventBusPipeRole.Arn
      Source: !Ref GatewayResponsesQueueARN
      SourceParameters:
        SqsQueueParameters:
          BatchSize: !Ref PipeBatchSize
          MaximumBatchingWindowInSeconds: !Ref PipeWindowSize
      Target: !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${ProjectName}-CoreEventBus
      TargetParameters:
        EventBridgeEventBusParameters:
          DetailType: "NationalRegistriesOutcomeEvent"
        InputTemplate: >-
          {
            "body": <$.body.payload>,
            "source": <$.body.clientId>
          }

  NationalRegistriesToEventBusPipeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - pipes.amazonaws.com
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:pipes:${AWS::Region}:${AWS::AccountId}:pipe/pn-national-registries-to-event-bus-pipe'

      Policies:
        - PolicyName: !Sub ${ProjectName}--National-registries-to-core-event-bus-policy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'sqs:ReceiveMessage'
                  - 'sqs:DeleteMessage'
                  - 'sqs:GetQueueAttributes'
                Resource: !Ref GatewayResponsesQueueARN
        - PolicyName: !Sub ${ProjectName}-National-registries-target-policy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'events:PutEvents'
                Resource:
                  - !Sub arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/${ProjectName}-CoreEventBus

  RequestErrorPipe:
    Type: AWS::Pipes::Pipe
    Properties:
      Name: pn-national-registries-request-error-pipe
      RoleArn: !GetAtt RequestErrorPipeRole.Arn
      Source: !Ref RequestsTableStreamArn
      SourceParameters:
        DynamoDBStreamParameters:
          StartingPosition: TRIM_HORIZON
          BatchSize: 1
        FilterCriteria:
          Filters:
            - Pattern: >
                {
                  "eventName": ["INSERT"],
                  "dynamodb": {
                    "NewImage": {
                      "status": {
                        "S": ["ERROR"]
                      }
                    }
                  }
                }
            - Pattern: >-
                {
                  "eventName": ["MODIFY"],
                  "dynamodb": {
                    "NewImage": {
                      "status": {
                        "S": ["ERROR"]
                      }
                    },
                    "OldImage": {
                      "status": {
                        "S": [
                          {
                            "anything-but": "ERROR"
                          }
                        ]
                      }
                    }
                  }
                }
      Target: !Ref GatewayInputsDLQARN
      TargetParameters:
        InputTemplate: >-
          {
            "taxId": "<$.dynamodb.NewImage.taxId.S>",
            "correlationId": "<$.dynamodb.NewImage.correlationId.S>",
            "recipientType": "<$.dynamodb.NewImage.recipientType.S>",
            "domicileType": "<$.dynamodb.NewImage.domicileType.S>",
            "referenceRequestDate": "<$.dynamodb.NewImage.referenceRequestDate.S>",
            "CxId": "<$.dynamodb.NewImage.clientId.S>"
          }

  PollingPipeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-national-registries-polling-pipe'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - pipes.amazonaws.com
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:pipes:${AWS::Region}:${AWS::AccountId}:pipe/pn-national-registries-polling-pipe'
      Policies:
        - PolicyName: pn-national-registries-polling-pipe-policy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadBatchDynamoDbStream
                Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource:
                  - !Ref BatchesTableStreamArn
              - Sid: SendToNationalRegistryPollingQueue
                Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  - !Ref PollingQueueARN

  PollingPipe:
    Type: AWS::Pipes::Pipe
    Properties:
      Name: pn-national-registries-polling-pipe
      RoleArn: !GetAtt PollingPipeRole.Arn
      Source: !Ref BatchesTableStreamArn
      SourceParameters:
        DynamoDBStreamParameters:
          StartingPosition: TRIM_HORIZON
          BatchSize: 1
        FilterCriteria:
          Filters:
            - Pattern: >-
                {
                  "eventName": ["MODIFY"],
                  "dynamodb": {
                    "NewImage": {
                      "status": {
                        "S": ["WORKING"]
                      }
                    },
                    "OldImage": {
                      "status": {
                        "S": [
                          {
                            "anything-but": "WORKING"
                          }
                        ]
                      }
                    }
                  }
                }
      Target: !Ref PollingQueueARN
      TargetParameters:
        SqsQueueParameters:
          MessageGroupId: $.dynamodb.NewImage.batchId.S
        InputTemplate: >-
          {
            "registry": "<$.dynamodb.NewImage.registry.S>",
            "batchId": "<$.dynamodb.NewImage.batchId.S>",
            "pollingId": "<$.dynamodb.NewImage.pollingId.S>",
            "batchSize": <$.dynamodb.NewImage.batchSize.N>,
            "errorRetryCount": <$.dynamodb.NewImage.errorRetryCount.N>,
            "inProgressRetryCount": <$.dynamodb.NewImage.inProgressRetryCount.N>
          }

  CompletedRequestPipe:
    Type: AWS::Pipes::Pipe
    Properties:
      Name: pn-national-registries-completed-request-pipe
      RoleArn: !GetAtt CompletedRequestPipeRole.Arn
      Source: !Ref RequestsTableStreamArn

      SourceParameters:
        DynamoDBStreamParameters:
          StartingPosition: TRIM_HORIZON
          BatchSize: 1

        FilterCriteria:
          Filters:
            - Pattern: >
                {
                  "eventName": ["INSERT"],
                  "dynamodb": {
                    "NewImage": {
                      "status": {
                        "S": ["WORKED"]
                      },
                      "resultPayload": {
                        "S": [
                          {
                            "exists": true
                          }
                        ]
                      }
                    }
                  }
                }
            - Pattern: >
                {
                  "eventName": ["MODIFY"],
                  "dynamodb": {
                    "NewImage": {
                      "status": {
                        "S": ["WORKED"]
                      },
                      "resultPayload": {
                        "S": [
                          {
                            "exists": true
                          }
                        ]
                      }
                    },
                    "OldImage": {
                      "status": {
                        "S": [
                          {
                            "anything-but": "WORKED"
                          }
                        ]
                      }
                    }
                  }
                }

      Target: !Ref GatewayResponsesQueueARN
      TargetParameters:
        InputTemplate: >
          <$.dynamodb.NewImage.resultPayload.S>

  CompletedRequestPipeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - pipes.amazonaws.com
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:pipes:${AWS::Region}:${AWS::AccountId}:pipe/pn-national-registries-completed-request-pipe'

      Policies:
        - PolicyName: pn-national-registries-completed-request-pipe-policy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource:
                  - !Ref RequestsTableStreamArn
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  - !Ref GatewayResponsesQueueARN
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: !Ref BatchRequestEncryptKeyARN

  ApiGateway:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${TemplateBucketBaseUrl}/fragments/api-gw-expose-service.yaml"
      Parameters:
        MicroServiceUniqueName: !Sub '${ProjectName}-national-registries'
        IntendedUsage: PNPG
        DnsName: !Ref SelcpgApiDnsName
        ProjectName: !Ref ProjectName
        ServiceApiPath: 'national-registries-private'
        NetworkLoadBalancerLink: !Ref NetworkLoadBalancerLink
        ApplicationLoadBalancerDomain: !Ref ApplicationLoadBalancerDomain
        AlarmSNSTopicArn: !Ref AlarmSNSTopicArn
        CloudwatchLogKinesisStreamArn: !Ref LogsKinesisSourceStreamArn

  ApiWaf:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${TemplateBucketBaseUrl}/fragments/api-gw-waf-acl.yaml"
      Parameters:
        WAFName: !Sub '${ProjectName}-national-registries-pnpg'
        IntendedUsage: PNPG
        APIGatewayARNs: !GetAtt ApiGateway.Outputs.APIGatewayARN
        AlarmSNSTopicArn: !Ref AlarmSNSTopicArn

  CertificateRenewalManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ${ProjectName}-Certificate-Renewal-Managed-Policy
      Roles:
        - !Ref CertificateRenewalCodeBuildServiceRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
          - Effect: Allow
            Action: 
              - sts:AssumeRole
            Resource: 
              - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/pn-cert-renewal-codebuild
          - Effect: Allow
            Action: 
              - ssm:PutParameter
              - ssm:GetParameter
            Resource: 
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${SecretAndSSMPrefix}*
          - Effect: Allow
            Action: 
              - kms:ListAliases
              - kms:UpdateAlias
              - kms:DescribeKey
              - kms:Sign
              - kms:CreateKey
              - kms:GetPublicKey
              - kms:ScheduleKeyDeletion
            Resource: 
              - '*'   
          - Effect: Allow
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:CreateSecret
              - secretsmanager:UpdateSecret
              - secretsmanager:DescribeSecret
            Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${SecretAndSSMPrefix}*      
          - Effect: Allow
            Action:
              - route53:ListHostedZones
              - route53:GetChange
              - route53:ChangeResourceRecordSets
            Resource: "*"
          - Effect: Allow
            Action:
              - sqs:ChangeMessageVisibility
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
              - sqs:GetQueueUrl
              - sqs:ReceiveMessage
              - sqs:SendMessage
            Resource:
              - !Ref CertificateDLQARN
                  
  CertificateRenewalCodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ProjectName}-cert-renewal-codebuild
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - "codebuild.amazonaws.com"
            Action:
              - "sts:AssumeRole"
          - Effect: Allow
            Principal:
              AWS:
                - !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Condition:
              ArnEquals:
                aws:PrincipalArn: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/pn-cert-renewal-codebuild
            Action:
              - "sts:AssumeRole"              

  InfocamereCertRenewalCodebuildProject:
    Type: 'AWS::CodeBuild::Project'
    Properties:
      Name: !Sub ${ProjectName}-Infocamere-Cert-Renewal
      ServiceRole: !GetAtt CertificateRenewalCodeBuildServiceRole.Arn
      ConcurrentBuildLimit: 1
      TimeoutInMinutes: 10
      Source: 
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - echo "### NO PRE_BUILD"
            build:
              commands:
                - session=$(aws sts assume-role --role-arn ${ASSUME_ROLE} --role-session-name test)
                - export AWS_ACCESS_KEY_ID=$(echo "${session}" | jq -r '.Credentials.AccessKeyId')
                - export AWS_SECRET_ACCESS_KEY=$(echo "${session}" | jq -r '.Credentials.SecretAccessKey')
                - export AWS_SESSION_TOKEN=$(echo "${session}" | jq -r '.Credentials.SessionToken')                    
                - git clone https://github.com/pagopa/pn-national-registries.git
                - cd pn-national-registries/scripts/generate_certificate_from_kms
                - docker build -t certificate-manager .
                - docker run -i --rm --env AWS_ACCESS_KEY_ID --env AWS_SECRET_ACCESS_KEY --env AWS_SESSION_TOKEN certificate-manager:latest /bin/bash ./create_kms_and_generate_cert.sh --keyalias ${KEY_ALIAS} --fqdn ${FQDN} --parameter-name ${PARAM_NAME} --region ${REGION} --e-mail ${EMAIL}
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        PrivilegedMode: true
        ComputeType: BUILD_GENERAL1_SMALL
        Type: LINUX_CONTAINER
        Image: "aws/codebuild/standard:7.0"
        EnvironmentVariables:
          - Name: ASSUME_ROLE
            Type: PLAINTEXT
            Value: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/pn-cert-renewal-codebuild
          - Name: REGION
            Type: PLAINTEXT
            Value: !Ref AWS::Region
          - Name: EMAIL
            Type: PLAINTEXT
            Value: !Ref CertificateRenewalEmail
          - Name: FQDN
            Type: PLAINTEXT
            Value: !Ref InfoCamereFqdn
          - Name: KEY_ALIAS
            Type: PLAINTEXT
            Value: !Sub ${InfoCamereSigningKeyAlias}-next
          - Name: PARAM_NAME
            Type: PLAINTEXT
            Value: !Sub ${InfoCamereCertPath}-next

  InfocamereCertRenewalCodebuildAlarms:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${TemplateBucketBaseUrl}/fragments/codebuild-alarms.yaml"
      Parameters:
        CodeBuildProjectName: !Ref InfocamereCertRenewalCodebuildProject
        AlarmSNSTopicArn: !Ref AlarmSNSTopicArn

  AdeCertRenewalCodebuildProject:
    Type: 'AWS::CodeBuild::Project'
    Properties:
      Name: !Sub ${ProjectName}-Ade-Cert-Renewal
      ServiceRole: !GetAtt CertificateRenewalCodeBuildServiceRole.Arn
      ConcurrentBuildLimit: 1
      TimeoutInMinutes: 10
      Source: 
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - echo "### NO PRE_BUILD"
            build:
              commands:
                - session=$(aws sts assume-role --role-arn ${ASSUME_ROLE} --role-session-name test)
                - export AWS_ACCESS_KEY_ID=$(echo "${session}" | jq -r '.Credentials.AccessKeyId')
                - export AWS_SECRET_ACCESS_KEY=$(echo "${session}" | jq -r '.Credentials.SecretAccessKey')
                - export AWS_SESSION_TOKEN=$(echo "${session}" | jq -r '.Credentials.SessionToken')                    
                - git clone https://github.com/pagopa/pn-national-registries.git
                - cd pn-national-registries/scripts/generate_certificate_from_kms
                - docker build -t certificate-manager .
                - docker run -i --rm --env AWS_ACCESS_KEY_ID --env AWS_SECRET_ACCESS_KEY --env AWS_SESSION_TOKEN certificate-manager:latest /bin/bash ./generate_no_kms.sh --fqdn ${FQDN} --secretid ${SECRET_ID} --parameter-name ${PARAM_NAME} --e-mail ${EMAIL} --region ${REGION}
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        PrivilegedMode: true
        ComputeType: BUILD_GENERAL1_SMALL
        Type: LINUX_CONTAINER
        Image: "aws/codebuild/standard:7.0"
        EnvironmentVariables:
          - Name: ASSUME_ROLE
            Type: PLAINTEXT
            Value: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/pn-cert-renewal-codebuild
          - Name: REGION
            Type: PLAINTEXT
            Value: !Ref AWS::Region
          - Name: EMAIL
            Type: PLAINTEXT
            Value: !Ref CertificateRenewalEmail
          - Name: FQDN
            Type: PLAINTEXT
            Value: !Ref AdeFqdn
          - Name: SECRET_ID
            Type: PLAINTEXT
            Value: !Sub ${AdeSslSecret}-next
          - Name: PARAM_NAME
            Type: PLAINTEXT
            Value: !Sub ${AdeSslCertPath}-next

  AdeCertRenewalCodebuildAlarms:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${TemplateBucketBaseUrl}/fragments/codebuild-alarms.yaml"
      Parameters:
        CodeBuildProjectName: !Ref AdeCertRenewalCodebuildProject
        AlarmSNSTopicArn: !Ref AlarmSNSTopicArn

  CertificateRenewalCodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
        Version: "2012-10-17"
      Policies:
        - PolicyName: runCodeBuild
          PolicyDocument:
            Statement:
              - Sid: startProjectRun
                Action:
                  - "codebuild:*"
                Effect: Allow
                Resource: 
                  - !GetAtt InfocamereCertRenewalCodebuildProject.Arn
                  - !GetAtt AdeCertRenewalCodebuildProject.Arn
        - PolicyName: sqsPut
          PolicyDocument:
            Statement:
              - Sid: putInDLQ
                Action:
                  - sqs:ChangeMessageVisibility
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                  - sqs:ReceiveMessage
                  - sqs:SendMessage
                Effect: Allow
                Resource:
                  - !Ref CertificateDLQARN
                  
  InfocamereScheduledRule:
    Type: AWS::Events::Rule
    Properties:
      Description: !Sub "${ProjectName}-infocamere-cert-renewal-schedule-rule"
      ScheduleExpression: "cron(0 10 ? SEP,NOV,JAN,MAR,MAY,JUL 4#1 *)" # the first WED of the month at 11:00 am, in one of these months: SEP,NOV,JAN,MAR,MAY,JUL
      State: "ENABLED"
      RoleArn: !GetAtt "CertificateRenewalCodeBuildRole.Arn"
      Targets: 
        - Id: "CertRenewalAlarm"
          Arn: !Ref CertificateDLQARN
        - Id: "CertRenewalRunner"
          RoleArn: !GetAtt "CertificateRenewalCodeBuildRole.Arn"
          Arn: 
            Fn::GetAtt: 
              - "InfocamereCertRenewalCodebuildProject"
              - "Arn"
      
  AdeScheduledRule:
    Type: AWS::Events::Rule
    Properties:
      Description: !Sub "${ProjectName}-Ade-cert-renewal-schedule-rule"
      ScheduleExpression: "cron(30 10 ? SEP,NOV,JAN,MAR,MAY,JUL 4#1 *)" # the first WED of the month at 11:00 am, in one of these months: SEP,NOV,JAN,MAR,MAY,JUL
      State: "ENABLED"
      RoleArn: !GetAtt "CertificateRenewalCodeBuildRole.Arn"
      Targets: 
        - Id: "CertRenewalAlarm"
          Arn: !Ref CertificateDLQARN
        - Id: "CertRenewalRunner"
          RoleArn: !GetAtt "CertificateRenewalCodeBuildRole.Arn"
          Arn: 
            Fn::GetAtt: 
              - "AdeCertRenewalCodebuildProject"
              - "Arn"

  CertDLQQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref "CertificateDLQURL"
      PolicyDocument:
        Statement:
          - Sid: "SendEventsToDLQ"
            Effect: "Allow"
            Principal: 
              Service: 
                - "events.amazonaws.com"
            Action: 
              - "SQS:SendMessage"
            Resource:
              - !Ref "CertificateDLQARN"
