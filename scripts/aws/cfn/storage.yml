  CounterTable:
    Type: AWS::DynamoDB::Table
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain 
    Properties:
      TableName: !Sub '${ProjectName}-counter'
      AttributeDefinitions:
        - AttributeName: "eservice"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "eservice"
          KeyType: "HASH"
      BillingMode: "PAY_PER_REQUEST"
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true   
        
  BatchRequestTable:
    Type: AWS::DynamoDB::Table
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain 
    Properties:
      TableName: !Sub '${ProjectName}-batchRequests'
      AttributeDefinitions:
        - AttributeName: "correlationId"
          AttributeType: "S"
        - AttributeName: "batchId"
          AttributeType: "S"
        - AttributeName: "status"
          AttributeType: "S"
        - AttributeName: "lastReserved"
          AttributeType: "S"
        - AttributeName: "sendStatus"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "correlationId"
          KeyType: "HASH"
      GlobalSecondaryIndexes:
        - IndexName: "batchId-lastReserved-index"
          KeySchema:
            - AttributeName: batchId
              KeyType: HASH
            - AttributeName: lastReserved
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: "status-index"
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: "sendStatus-lastReserved-index"
          KeySchema:
            - AttributeName: sendStatus
              KeyType: HASH
            - AttributeName: lastReserved
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      BillingMode: "PAY_PER_REQUEST"
      SSESpecification:
        KMSMasterKeyId: !Ref PnBatchRequestEncryptKey
        SSEEnabled: true
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true           

  PnNationalRegistriesRequestsTable:
    Type: AWS::DynamoDB::Table
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub '${ProjectName}-NationalRegistriesRequests'
      AttributeDefinitions:
        - AttributeName: "correlationId"
          AttributeType: "S"
        - AttributeName: "createdAt"
          AttributeType: "S"
        - AttributeName: "batchId"
          AttributeType: "S"
        - AttributeName: "registryStatus"
          AttributeType: "S"
        - AttributeName: "status"
          AttributeType: "S"
        - AttributeName: "attemptAfter"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "correlationId"
          KeyType: "HASH"
        - AttributeName: "createdAt"
          KeyType: "RANGE"
      GlobalSecondaryIndexes:
        - IndexName: "batchId-status-index"
          KeySchema:
            - AttributeName: batchId
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: "registryStatus-attemptAfter-index"
          KeySchema:
            - AttributeName: registryStatus
              KeyType: HASH
            - AttributeName: attemptAfter
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      BillingMode: "PAY_PER_REQUEST"
      SSESpecification:
        KMSMasterKeyId: !Ref PnBatchRequestEncryptKey
        SSEEnabled: true
        SSEType: KMS
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  BatchPollingTable:
    Type: AWS::DynamoDB::Table
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain 
    Properties:
      TableName: !Sub '${ProjectName}-batchPolling'
      AttributeDefinitions:
        - AttributeName: "batchId"
          AttributeType: "S"
        - AttributeName: "status"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "batchId"
          KeyType: "HASH"
      GlobalSecondaryIndexes:
        - IndexName: "status-index"
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      BillingMode: "PAY_PER_REQUEST"
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # Shared lock handling table
  ShedLockTable:
    Type: AWS::DynamoDB::Table
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub '${ProjectName}-nationalRegistriesShedLock'
      AttributeDefinitions:
        - AttributeName: "_id"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "_id"
          KeyType: "HASH"
      BillingMode: "PAY_PER_REQUEST"
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  PnNationalRegistriesBatchesTable:
    Type: AWS::DynamoDB::Table
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      TableName: !Sub '${ProjectName}-NationalRegistriesBatches'
      AttributeDefinitions:
        - AttributeName: "batchId"
          AttributeType: "S"
        - AttributeName: "sk"
          AttributeType: "S"
        - AttributeName: "status"
          AttributeType: "S"
        - AttributeName: "attemptAfter"
          AttributeType: "S"
      KeySchema:
        - AttributeName: "batchId"
          KeyType: "HASH"
        - AttributeName: "sk"
          KeyType: "RANGE"
      GlobalSecondaryIndexes:
        - IndexName: "status-attemptAfter-index"
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: attemptAfter
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      BillingMode: "PAY_PER_REQUEST"
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  PnNationalRegistriesLogGroup:
    Type: AWS::CloudFormation::Stack
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain 
    Properties:
      TemplateURL: !Sub "${TemplateBucketBaseUrl}/fragments/log-group.yaml"
      Parameters:
        LogGroupName: !Sub '${ProjectName}-national-registries'
        LogGroupRetention: !Ref LogRetention
        LogsKinesisSourceStreamArn: !Ref LogsKinesisSourceStreamArn
        LogEnableDownstreamSubscriptionFilter: !Ref EnableDownstreamSubscriptionFilter

  PnNationalRegistriesCertificateDLQ:
    Type: AWS::CloudFormation::Stack
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain    
    Properties:
      TemplateURL: !Sub "${TemplateBucketBaseUrl}/fragments/sqs-queue.yaml"
      Parameters:
        QueueName: !Sub '${ProjectName}-national_registries_certificate_DLQ'
        DelaySeconds: 1
        AlarmSNSTopicName: !Ref AlarmSNSTopicName
        HasDLQ:  "false"
        QueueHasAlarm:  "true"

  # Coda per interna per memorizzare richieste al gateway
  # NB: usati i valori di default per: DelaySeconds, DeadLetterQueueName, MessageRetentionPeriod, MaxReceiveCount, DeadLetterMessageRetentionPeriod,
  PnNationalRegistryGatewayInputsQueue:
    Type: AWS::CloudFormation::Stack
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      TemplateURL: !Sub "${TemplateBucketBaseUrl}/fragments/sqs-queue.yaml"
      Parameters:
        QueueName: !Sub '${ProjectName}-national_registry_gateway_inputs'
        AlarmSNSTopicName: !Ref AlarmSNSTopicName
        VisibilityTimeout: 300
        MaxReceiveCount: 10
        DelaySeconds: 1

  PnNationalRegistriesPollingQueue:
    Type: AWS::CloudFormation::Stack
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      TemplateURL: !Sub "${TemplateBucketBaseUrl}/fragments/sqs-queue.yaml"
      Parameters:
        QueueName: !Sub '${ProjectName}-national_registries_polling'
        SqsManagedSseEnabled: true
        FifoQueue: 'true'
        MaxReceiveCount: 10
        QueueHasAlarm: 'false'
        ContentBasedDeduplication: true
        AlarmSNSTopicName: !Ref AlarmSNSTopicName
        DelaySeconds: 1
        VisibilityTimeout: 300

  PnNationalRegistriesGatewayResponsesQueue:
    Type: AWS::CloudFormation::Stack
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      TemplateURL: !Sub "${TemplateBucketBaseUrl}/fragments/sqs-queue.yaml"
      Parameters:
        QueueName: !Sub '${ProjectName}-national_registry_gateway_responses'
        AlarmSNSTopicName: !Ref AlarmSNSTopicName
        MaxReceiveCount: 10
        DelaySeconds: 1

#Necessario a causa di bug script deploy
Outputs:
  BatchRequestEncryptKeyARN:
    Description: BatchRequestEncryptKeyARN
    Value: !Sub '${PnBatchRequestEncryptKey.Arn}'
  # AnprPDNDSessionTokenSigningKeyARN:
  #   Description: AnprPDNDSessionTokenSigningKeyARN
  #   Value: !Sub '${AnprPDNDSessionTokenSigningKey.Arn}'
  # CheckCfPDNDSessionTokenSigningKeyARN:
  #   Description: CheckCfPDNDSessionTokenSigningKeyARN
