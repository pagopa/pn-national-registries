AWSTemplateFormatVersion: '2010-09-09'
Description: Some storage with input and output

Parameters:
  # Deployment and nested CloudFormation stacks
  ProjectName:
    Type: String
    Description: 'Deployment prefix used to name resources'

  Version:
    Type: String
    Description: 'Source revision identifier for tracking the deployed version.'

  # Unused but required by CD pipeline
  MicroserviceNumber:
    Type: Number
    Description: 'Microservice identifier required by the deployment pipeline but not used by storage resources.'

  # Required by CD pipeline and used by the nested log group and queue stacks
  TemplateBucketBaseUrl:
    Type: String
    Description: 'Base URL of the S3 bucket hosting the nested CloudFormation templates.'

  # Log retention, forwarding and queue alarms
  EnableDownstreamSubscriptionFilter:
    Type: String
    Default: false
    Description: 'Whether to enable the CloudWatch Logs subscription that forwards logs to Kinesis.'
    AllowedValues:
      - true
      - false

  LogsKinesisSourceStreamArn:
    Type: String
    Description: 'ARN of the Kinesis stream that receives logs when the downstream subscription is enabled.'

  LogRetention:
    Type: Number
    Default: 14
    Description: 'Number of days CloudWatch Logs retains events in the microservice log group.'

  AlarmSNSTopicName:
    Type: String
    Description: 'Name of the SNS topic notified by the SQS queue alarms.'

Resources:
  ###      KEY PAIR PER CREARE JWT NECESSARIO PER ACCEDERE AI SERVIZI M2M DI PDND    ###
  ###   La chiave viene impiegata per firmare il client assertion che serve          ###
  ###   per richedere a PDND il JWT da utilizzare per invocare i servizi M2M di PDND ###
  ######################################################################################
  PnBatchRequestEncryptKey:
    Type: 'AWS::KMS::Key'
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Symmetric default key to encrypt table
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      EnableKeyRotation: true
      KeyPolicy:
        Version: 2012-10-17
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'

