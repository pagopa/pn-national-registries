  #   Description: InfoCamereSigningKeyARN
  #   Value: !Sub '${InfoCamereSigningKey.Arn}'
  # InfoCamereSigningKeyId:
  #   Value: !Ref InfoCamereSigningKey

  CounterTableArn:
    Description: ARN Dynamo Name used by application to access the key-value store of CounterTable
    Value: !Sub '${CounterTable.Arn}'
  CounterTableName:
    Description: Name of the DynamoDB table that stores e-service counters.
    Value: !Ref CounterTable
  BatchRequestTableArn:
    Description: ARM Dynamo Name used by application to access the key-value store of BatchRequestTable
    Value: !Sub '${BatchRequestTable.Arn}'
  BatchPollingTableArn:
    Description: ARM Dynamo Name used by application to access the key-value store of BatchPollingTable
    Value: !Sub '${BatchPollingTable.Arn}'
  ShedLockTableArn:
    Description: ARN Dynamo Name used by application to access the key-value store of ShedLockTable
    Value: !Sub '${ShedLockTable.Arn}'
  ShedLockTableName:
    Description: Name of the ShedLockTable
    Value: !Ref ShedLockTable
  RequestsTableArn:
    Description: ARM Dynamo Name used by application to access the key-value store of RequestsTable
    Value: !Sub '${PnNationalRegistriesRequestsTable.Arn}'
  RequestsTableName:
    Description: Name of the RequestsTable
    Value: !Ref PnNationalRegistriesRequestsTable
  RequestsTableStreamArn:
    Value: !GetAtt PnNationalRegistriesRequestsTable.StreamArn

  # NationalRegistriesBatches Table
  BatchesTableArn:
    Value: !Sub '${PnNationalRegistriesBatchesTable.Arn}'
  BatchesTableName:
    Value: !Ref PnNationalRegistriesBatchesTable
  BatchesTableStreamArn:
    Value: !GetAtt PnNationalRegistriesBatchesTable.StreamArn

  # Log group exports
  EcsLogGroup:
    Value: !GetAtt PnNationalRegistriesLogGroup.Outputs.LogGroupName

  # National Registries Certificate renewal alarm DLQ
  CertificateDLQName:
    Value: !GetAtt PnNationalRegistriesCertificateDLQ.Outputs.QueueName
  CertificateDLQURL:
    Value: !GetAtt PnNationalRegistriesCertificateDLQ.Outputs.QueueURL
  CertificateDLQARN:
    Value: !GetAtt PnNationalRegistriesCertificateDLQ.Outputs.QueueARN
  CertificateDLQAlarmARN:
    Value: !GetAtt PnNationalRegistriesCertificateDLQ.Outputs.SqsDLQAlarmArn

  # PnNationalRegistryGatewayInputs Queue
  GatewayInputsQueueName:
    Value: !GetAtt PnNationalRegistryGatewayInputsQueue.Outputs.QueueName
  GatewayInputsQueueARN:
    Value: !GetAtt PnNationalRegistryGatewayInputsQueue.Outputs.QueueARN
  GatewayInputsDLQName:
    Value: !GetAtt PnNationalRegistryGatewayInputsQueue.Outputs.DeadLetterQueueName
  GatewayInputsDLQURL:
    Value: !GetAtt PnNationalRegistryGatewayInputsQueue.Outputs.DeadLetterQueueURL
  GatewayInputsDLQARN:
    Value: !GetAtt PnNationalRegistryGatewayInputsQueue.Outputs.DeadLetterQueueARN

  # PnNationalRegistriesPolling Queue
  PollingQueueName:
    Value: !GetAtt PnNationalRegistriesPollingQueue.Outputs.QueueName
  PollingQueueARN:
    Value: !GetAtt PnNationalRegistriesPollingQueue.Outputs.QueueARN
  GatewayResponsesQueueName:
    Value: !GetAtt PnNationalRegistriesGatewayResponsesQueue.Outputs.QueueName
  GatewayResponsesQueueARN:
    Value: !GetAtt PnNationalRegistriesGatewayResponsesQueue.Outputs.QueueARN