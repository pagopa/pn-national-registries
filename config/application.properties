spring.application.name=PN-NATIONAL-REGISTRIES
spring.main.web-application-type=REACTIVE

server.port=8080

spring.profiles.active=local
# Runtime mode
pn.env.runtime=DEVELOPMENT

# AWS specific configurations
aws.region=us-east-1
aws.region-code=us-east-1
aws.profile-name=default
aws.endpoint-url=http://localhost:4566

spring.cloud.aws.credentials.profile-name=default
spring.cloud.aws.region.static= us-east-1
spring.cloud.aws.sqs.endpoint= http://localhost:4566

# Fix null object in serialization
spring.jackson.default-property-inclusion=NON_NULL

# EnvironmentType
pn.national-registries.environment-type=DEV

pn.national.registries.issuer=.notifichedigitali.it

pn.national-registries.custom-retry-max-attempts=3

# Variabile di controllo per il parametro pn-national-registries-cx-id
pn.national-registries.enable-cx-id-validation=false

# PDND
pn.national-registries.pdnd.base-url=http://localhost:1080/nationalregistriesmock/
pn.national-registries.pdnd.client-assertion-type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer
pn.national-registries.pdnd.grant-type=client_credentials
pn.national-registries.pdnd.token.deadline=120000

# ANPR
pn.national-registries.anpr.base-url=http://localhost:1080/nationalregistriesmock/
pn.national-registries.anpr.pdnd-client-secret=pn-national-registries/pdnd/ANPR
pn.national-registries.anpr.trust-secret=pn-national-registries/anpr/auth
pn.national-registries.dao.counter-table-name=pn-counter
pn.national-registries.dao.shedlock-table-name=pn-nationalRegistriesShedLock
pn.national-registries.dao.requests-table-name=pn-NationalRegistriesRequests
pn.national-registries.dao.batches-table-name=pn-NationalRegistriesBatches

# AdE Legal
pn.national-registries.ade.legal-base-url=http://localhost:1080/nationalregistriesmock/
pn.national-registries.ade.auth=/pn-national-registries/ade-api-cert
pn.national-registries.ade.legal-name-id=15376371009/YHR
pn.national-registries.ade.legal-trust-secret=pn-national-registries/ade/auth

# AdE CheckCF
pn.national-registries.ade.check-cf-base-url=http://localhost:1080/nationalregistriesmock/
pn.national-registries.ade.check-cf-pdnd-client-secret=pn-national-registries/pdnd/CheckCF
pn.national-registries.ade.check-cf-trust-secret=pn-national-registries/CheckCF/auth-rest

# INAD
pn.national-registries.inad.base-url=http://localhost:1080/nationalregistriesmock/
pn.national-registries.inad.pdnd-client-secret=pn-national-registries/pdnd/INAD

# InfoCamere
pn.national-registries.infocamere.base-url=http://localhost:1080/nationalregistriesmock/ic/ce/wspa/wspa/rest/
pn.national-registries.infocamere.client-id=a7e152cac460917f3123cc2410f5a8d2
pn.national-registries.infocamere.cert-path=/pn-national-registries/infocamere-cert
pn.national.registries.infocamere.token.deadline=120000
pn.national-registries.batch-request-ttl=1209600
pn.national-registries.infocamere.connection-timeout-millis=4000
pn.national-registries.infocamere.read-timeout-millis=15000
pn.national-registries.infocamere.max-retry-attempts=1
pn.national-registries.infocamere.retry-on-timeout=false
pn.national-registries.inipec.polling-first-attempt-delay-seconds-per-cf=0.085
pn.national-registries.inipec.polling-first-attempt-fixed-delay-seconds=300
pn.national-registries.enable-old-inipec-flow=false

#Batch pec request configuration
pn.national-registries.inipec.request-batch-job-delay=5000
pn.national-registries.inipec.request-batch-job-lock-at-most=27000
pn.national-registries.inipec.request-batch-job-lock-at-least=22000
pn.national-registries.inipec.request-max-retry=3
pn.national-registries.inipec.max-batch-size=6250

pn.national-registries.query-limit=1000

#Batch pec polling configuration
pn.national-registries.inipec.polling-delay=5000
pn.national-registries.inipec.polling-lock-at-most=27000
pn.national-registries.inipec.polling-lock-at-least=22000
pn.national-registries.inipec.polling-error-max-retry=3
pn.national-registries.inipec.polling-in-progress-max-retry=24

#Batch pec recovery request configuration
pn.national-registries.inipec.request-recovery-delay=30000
pn.national-registries.inipec.request-recovery-lock-at-most=30000
pn.national-registries.inipec.request-recovery-lock-at-least=1000
pn.national-registries.inipec.request-recovery-after=3600

#Batch pec recovery batch polling configuration
pn.national-registries.inipec.polling-recovery-delay=30000
pn.national-registries.inipec.polling-recovery-lock-at-most=30000
pn.national-registries.inipec.polling-recovery-lock-at-least=1000
pn.national-registries.inipec.polling-recovery-after=3600

#Batch pec send to SQS configuration
pn.national-registries.inipec.sqs-recovery-delay=30000
pn.national-registries.inipec.sqs-recovery-lock-at-most=30000
pn.national-registries.inipec.sqs-recovery-lock-at-least=1000

pn.national-registries.polling-delay=5000
pn.national-registries.polling-lock-at-most=27000
pn.national-registries.polling-lock-at-least=22000

# IPA
pn.national-registries.ipa.base-url=http://localhost:1080/nationalregistriesmock/
pn.national-registries.ipa.secret=pn-national-registries/ipa

# Gateway
pn.national-registries.topic.output-queue-name=pn-national_registry_gateway_outputs
pn.national-registries.topic.input-queue-name=pn-national_registry_gateway_inputs
pn.national-registries.topic.input-dlq-queue-name=pn-national_registry_gateway_inputs-DLQ
pn.national-registries.topic.polling-queue-name=pn-national_registries_polling.fifo
pn.national-registries.topic.gateway-response-queue-name=pn-national_registry_gateway_responses

# Health Check
pn.national-registries.health-check-path=http://localhost

# Enable flow INAD -> INIPEC for PF
pn.national-registries.enable-pf-pec-fallback-flow=false
pn.national-registries.enable-inad-massive-api=true
pn.national-registries.inad.max-batch-size=1000
pn.national-registries.inad.request-oldest-max-waiting-seconds=300
pn.national-registries.inad.request-batch-job-delay=5000
pn.national-registries.inad.request-batch-job-lock-at-most=27000
pn.national-registries.inad.request-batch-job-lock-at-least=22000