logging.config=classpath:logback-base.xml
spring.application.name = pn-national-registries
spring.main.web-application-type=REACTIVE

server.port=8080

# Fix null object in serialization
spring.jackson.default-property-inclusion = NON_NULL

pn.national.registries.issuer = .notifichedigitali.it

# PDND
pn.national-registries.pdnd.client-assertion-type = urn:ietf:params:oauth:client-assertion-type:jwt-bearer
pn.national-registries.pdnd.grant-type = client_credentials
pn.national-registries.pdnd.token.deadline = 120000

# InfoCamere
pn.national.registries.infocamere.token.deadline = 120000

#Batch pec request configuration
pn.national-registries.inipec.batch-request-pk-separator = ~

#Batch pec polling configuration
pn.national-registries.inipec.polling-delay=${PN_NATIONALREGISTRIES_INIPEC_POLLINGDELAY:30000}
pn.national-registries.inipec.polling-lock-at-most=${PN_NATIONALREGISTRIES_INIPEC_POLLINGLOCKATMOST:27000}
pn.national-registries.inipec.polling-lock-at-least=${PN_NATIONALREGISTRIES_INIPEC_POLLINGLOCKATLEAST:22000}

#Batch pec recovery request configuration
pn.national-registries.inipec.request-recovery-delay=${PN_NATIONALREGISTRIES_INIPEC_REQUESTRECOVERYDELAY:30000}
pn.national-registries.inipec.request-recovery-lock-at-most=${PN_NATIONALREGISTRIES_INIPEC_REQUESTRECOVERYLOCKATMOST:30000}
pn.national-registries.inipec.request-recovery-lock-at-least=${PN_NATIONALREGISTRIES_INIPEC_REQUESTRECOVERYLOCKATLEAST:1000}

#Batch pec recovery batch polling configuration
pn.national-registries.inipec.polling-recovery-delay=${PN_NATIONALREGISTRIES_INIPEC_POLLINGRECOVERYDELAY:30000}
pn.national-registries.inipec.polling-recovery-lock-at-most=${PN_NATIONALREGISTRIES_INIPEC_POLLINGRECOVERYLOCKATMOST:30000}
pn.national-registries.inipec.polling-recovery-lock-at-least=${PN_NATIONALREGISTRIES_INIPEC_POLLINGRECOVERYLOCKATLEAST:1000}

#Batch pec send to SQS configuration
pn.national-registries.inipec.sqs-recovery-delay=${PN_NATIONALREGISTRIES_INIPEC_SQSRECOVERYDELAY:30000}
pn.national-registries.inipec.sqs-recovery-lock-at-most=${PN_NATIONALREGISTRIES_INIPEC_SQSRECOVERYLOCKATMOST:30000}
pn.national-registries.inipec.sqs-recovery-lock-at-least=${PN_NATIONALREGISTRIES_INIPEC_SQSRECOVERYLOCKATLEAST:1000}

# Shared polling job
pn.national-registries.polling-delay=${PN_NATIONALREGISTRIES_POLLINGDELAY:5000}
pn.national-registries.polling-lock-at-most=${PN_NATIONALREGISTRIES_POLLINGLOCKATMOST:27000}
pn.national-registries.polling-lock-at-least=${PN_NATIONALREGISTRIES_POLLINGLOCKATLEAST:22000}

management.endpoints.web.exposure.include=health,metrics,loggers
